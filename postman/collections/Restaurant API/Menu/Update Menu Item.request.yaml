$kind: http-request
name: Update Menu Item
method: PUT
url: '{{base_url}}/api/menu/:id'
order: 4000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Margherita Classic",
      "category": "Pizza",
      "price": 13.99
    }
